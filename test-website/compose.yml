# test-website — validates DNS -> TLS -> nginx -> Docker network -> app.
# Scaffolding, deliberately disposable. docs/PLAN.md §9.

services:
  test-website:
    build: .
    image: test-website:1.0.0
    container_name: test-website
    restart: unless-stopped

    # No `ports:`. Only nginx is published — rule 20.
    expose:
      - "3000"

    networks:
      - proxy-net

    environment:
      APP_ENV: vps-prod
      TZ: UTC

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{const j=JSON.parse(d);process.exit(j.status==='ok'?0:1)})}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
        reservations:
          memory: 32M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}"

networks:
  proxy-net:
    external: true
