# Managed from git. Do not edit on the server.
# See docs/PLAN.md §7 and .claude/rules/10-logging-audit.md

user  nginx;
worker_processes  auto;                 # = 2 on this host
pid /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;                  # do not advertise the version

    # ---------------------------------------------------------------------
    # Canonical JSON access log — .claude/rules/10-logging-audit.md
    #
    # nginx has no millisecond variable. $request_time is seconds with 3
    # decimals, so this map converts it rather than logging seconds into a
    # field named _ms, which would be a quiet lie that survives into every
    # dashboard built on it.
    # ---------------------------------------------------------------------
    # The regex MUST be quoted: nginx's parser treats an unquoted `{` as a
    # block delimiter, so `{3}` breaks the config with a misleading
    # "unexpected {" error pointing at this line.
    map $request_time $request_time_ms {
        "~^(\d+)\.(\d{3})$"  "$1$2";
        default              "0";
    }

    # $upstream_status is empty when nginx answers without an upstream.
    # Empty would break the JSON, so normalise it.
    map $upstream_status $upstream_status_safe {
        ""       "-";
        default  $upstream_status;
    }
    map $upstream_addr $upstream_addr_safe {
        ""       "-";
        default  $upstream_addr;
    }

    # escape=json is MANDATORY. Without it a crafted URL breaks the JSON and
    # poisons every downstream parser.
    log_format json_main escape=json
      '{"ts":"$time_iso8601","level":"info","service":"nginx","env":"vps-prod",'
      '"host":"$hostname","event":"http.request","actor":"$remote_user",'
      '"source_ip":"$remote_addr","request_id":"$request_id",'
      '"target":"$request_uri","method":"$request_method","status":$status,'
      '"outcome":"$upstream_status_safe","duration_ms":$request_time_ms,'
      '"upstream":"$upstream_addr_safe","upstream_ms":"$upstream_response_time",'
      '"bytes_sent":$body_bytes_sent,"referer":"$http_referer",'
      '"user_agent":"$http_user_agent","server_name":"$server_name",'
      '"scheme":"$scheme","msg":""}';

    access_log /var/log/nginx/access.log json_main;

    # --- timeouts: slow-client protection -------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout    65;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;
    reset_timedout_connection on;

    client_max_body_size 1m;            # global floor; locations raise it

    # --- compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    # --- upstream DNS ----------------------------------------------------
    # Docker's embedded DNS. Without this, nginx resolves upstream hostnames
    # ONCE at config load and caches forever: any backend recreated with a new
    # IP leaves nginx 502-ing until a human reloads it, which breaks unattended
    # recovery after a reboot or a container update. Found in Phase 7.
    #
    # Re-resolution only happens when proxy_pass contains a VARIABLE, hence the
    # `set $upstream_* ...` lines in conf.d. Because a variable proxy_pass no
    # longer appends the URI automatically, $request_uri must be explicit.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- rate limit zones (definitions only; applied per location) -------
    include /etc/nginx/snippets/rate-limit.conf;

    include /etc/nginx/conf.d/*.conf;
}
