# Baseline headers.
#
# `always` is NOT optional: without it add_header is skipped on 4xx/5xx, so
# error pages ship without security headers — exactly when they matter.
#
# NOTE: add_header does NOT merge. A single add_header in a location block
# discards every header inherited from the parent. Each app therefore includes
# a COMPLETE snippet, never a partial one. This is the most common way
# security headers silently vanish.
#
# HSTS is deliberately absent here — it is added at Phase 11 (public launch),
# and without `preload`. Pinning browsers to a hostname still under
# experimentation is self-inflicted.
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header X-Request-Id              $request_id always;
