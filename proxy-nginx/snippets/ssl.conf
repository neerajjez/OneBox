# TLS 1.2 + 1.3 only. Mozilla Intermediate ciphers: modern-only would be
# cleaner but risks locking out an older client on the day you need access.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;          # let TLS1.3 clients choose
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;                # forward secrecy

# OCSP stapling is OFF while using a self-signed placeholder cert — it would
# log a resolver error on every start. Turn on with the real cert (Phase 3b).
# ssl_stapling on;
# ssl_stapling_verify on;
