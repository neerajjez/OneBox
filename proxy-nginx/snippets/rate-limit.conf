# Zone definitions only. Applied per-location — see docs/PLAN.md §7.
#
# 30 r/s general: a dashboard page load is 20-40 requests, so burst 60 nodelay
# absorbs a normal page while a scraper does not.
# 5 r/m auth: generous for a human, useless for a brute-forcer. MFA is the
# real control; this just sheds noise.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

limit_req_status  429;
limit_conn_status 429;
