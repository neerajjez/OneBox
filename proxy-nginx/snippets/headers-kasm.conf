# Kasm-specific headers. COMPLETE set, not a partial — add_header does not
# merge, so one add_header in a location discards everything inherited.
#
# Deliberately omits X-Frame-Options: Kasm renders sessions in frames and a
# generic SAMEORIGIN/DENY produces a blank canvas or a session that connects
# then dies — symptoms that look like a network fault, not a header problem.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Request-Id           $request_id always;
# Clipboard is the main reason Kasm replaced Guacamole; Chromium requires an
# explicit grant for the async clipboard API in a secure context.
add_header Permissions-Policy     "clipboard-read=(self), clipboard-write=(self), geolocation=(), microphone=(), camera=()" always;
