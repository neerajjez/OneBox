# default_server for :80. `server_name _` is NOT a wildcard — it is simply a
# name no real Host matches — so without default_server here, requests
# addressed by IP fell through to 00-default's `return 444` and the redirect
# never happened. Every HTTP request should become HTTPS; there is nothing on
# :80 worth refusing.
server {
    listen 80 default_server;
    server_name _;

    # ACME http-01 webroot — unused on the tailnet (tailscale cert does not
    # need it), in place ready for Phase 11 certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
