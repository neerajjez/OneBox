# Internal health listener. NOT published in compose — reachable only from
# inside the container and from proxy-net.
#
# Why a separate listener: the healthcheck connects to 127.0.0.1, so its Host
# header matches no server_name and falls through to 00-default's `return 444`.
# The check could never pass. Rather than weaken the catch-all (its whole job
# is refusing unknown Hosts), health gets its own port.
#
# Also the Prometheus scrape target for nginx in Phase 5.
server {
    listen 8080 default_server;
    server_name _;

    access_log off;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}\n';
    }

    location = /stub_status {
        stub_status;
    }

    location / { return 404; }
}
