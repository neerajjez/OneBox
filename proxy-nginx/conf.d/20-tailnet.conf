server {
    # default_server: with no domain yet, requests arrive by raw IP, and an IP
    # matches no server_name. Previously those fell through to 00-default's
    # `return 444`, which closes the connection with no response — a browser
    # reports that as ERR_HTTP2_PROTOCOL_ERROR, not as a rejection.
    #
    # Accepting any Host is correct for an IP-addressed server. Host-based
    # filtering returns at Phase 11 once a real domain exists.
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 20;

    # nginx's own liveness. Answered locally, so it proves nginx is serving
    # rather than that some upstream is.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}\n';
    }

    # Phase 7: Kasm Workspaces under /webrdp/.
    #
    # TWO halves are required and BOTH must agree — the Kasm zone is configured
    # with proxy_path=/webrdp and proxy_port=0 (docs/PLAN.md §15b). An nginx
    # location alone is not sufficient; Kasm would generate absolute URLs at /
    # and the login page would load without CSS.
    #
    # NOTE the trailing slash on proxy_pass: it STRIPS /webrdp before the
    # upstream sees it. This is the opposite of /monitoring/ above, which
    # passes its prefix through because Grafana expects it. Same-looking
    # config, opposite behaviour — getting it backwards is the classic
    # subpath failure.
    #
    # No limit_req here: this location carries long-lived WebSocket sessions,
    # and a rate limit would terminate them mid-session, presenting as "the
    # workspace randomly disconnects". Auth endpoints are limited separately
    # below.
    location /webrdp/ {
        proxy_pass https://kasm_proxy:8443/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Request-Id      $request_id;

        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;
        proxy_buffering       off;
        client_max_body_size  512m;

        # Kasm's internal listener uses its own self-signed certificate. This
        # hop is inside the Docker network to a known container, so not
        # verifying is acceptable here — do not let this spread.
        proxy_ssl_verify off;

        include /etc/nginx/snippets/headers-kasm.conf;
        limit_conn perip 20;
    }

    # Authentication endpoints only: strict limit. Brute force is the threat
    # here (T2); MFA is the real control and this sheds the noise.
    # A regex location cannot strip a prefix via a trailing slash on
    # proxy_pass the way a prefix location can, so the rewrite does it
    # explicitly. Without this the upstream receives /webrdp/api/... which
    # Kasm does not know, and nginx returns 404 — the exact prefix mismatch
    # warned about above, which I made here first time round.
    location ~ ^/webrdp/api/(public/)?(authenticate|login) {
        limit_req zone=auth burst=5 nodelay;
        rewrite ^/webrdp/(.*)$ /$1 break;
        proxy_pass https://kasm_proxy:8443;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_ssl_verify off;
        include /etc/nginx/snippets/headers-kasm.conf;
    }

    # Phase 5: Grafana under a subpath. Grafana itself is configured with
    # serve_from_sub_path=true so it generates /monitoring/-prefixed URLs;
    # without that the UI half-works in a way that looks like a proxy bug.
    #
    # NOTE: no trailing slash on proxy_pass — the /monitoring prefix must be
    # PASSED THROUGH, unlike Kasm (§15b) which strips it. Getting this
    # backwards is the classic subpath failure.
    location /monitoring/ {
        limit_req zone=general burst=60 nodelay;
        set $upstream_grafana grafana;
        proxy_pass http://$upstream_grafana:3000$request_uri;
        include /etc/nginx/snippets/proxy-common.conf;

        # Grafana Live uses websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Phase 4: the test website. Served from a real upstream, NOT `return` —
    # `return` runs in the rewrite phase, before preaccess, so a `return`
    # location silently ignores its own limit_req.
    location / {
        limit_req zone=general burst=60 nodelay;
        set $upstream_site test-website;
        proxy_pass http://$upstream_site:3000$request_uri;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
