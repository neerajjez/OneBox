# Intentionally empty.
#
# This file held the catch-all that refused unknown Host headers with 444.
# With no domain yet, every request arrives addressed by raw IP and matches no
# server_name, so the catch-all refused legitimate traffic — that was the
# ERR_HTTP2_PROTOCOL_ERROR (444 closes the connection with no response, which a
# browser reports as a protocol error).
#
# :443 default_server is now 20-tailnet.conf; :80 default_server is
# 10-redirect.conf.
#
# RESTORE AT PHASE 11: once a real domain exists, reinstate a 444 catch-all so
# scanners hitting the bare IP or a bogus Host are refused, and give the site
# server an explicit server_name instead of `_`.
