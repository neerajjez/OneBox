# proxy-nginx — the only public-facing service (docs/PLAN.md §7)
#
# Phase 3: bound to the Tailscale interface ONLY. Nothing is reachable from the
# internet. Phase 11 adds a second published port set for 0.0.0.0:80/443.

services:
  nginx:
    # Pinned by digest, not just tag — rule 20. arm64 manifest verified.
    image: nginx:1.27-alpine@sha256:63ffc0d1f14e4082b832c6a42e606e9a0384a526f16ddd720af7c1f018f2f7c4
    container_name: nginx
    restart: unless-stopped

    # Bound to ALL interfaces, at the user's direction, ahead of opening 443
    # in the OCI NSG. Until that NSG rule exists nothing is reachable from the
    # internet; once it does, THIS IS A PUBLIC SERVER. What now stands between
    # it and the internet is the OCI security list plus the host firewall —
    # not the bind address.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"

    networks:
      - proxy-net

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./html:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro

    environment:
      TZ: UTC                      # rule 10: timestamps are UTC everywhere

    # read_only rootfs; nginx needs exactly three writable paths.
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE           # bind 80/443
      - CHOWN                      # master drops privileges to the nginx user
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    healthcheck:
      # Proves nginx is SERVING, not that a process exists.
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}"

networks:
  proxy-net:
    external: true

volumes:
  certbot-webroot:
