# monitoring — Prometheus, Grafana, Alertmanager, nginx-exporter.
# docs/PLAN.md §10-13. node_exporter runs on the HOST as a systemd unit.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days, not 30: roughly 1.5-2.5 GB here, and it halves the memory
      # Prometheus holds for its head block on a box where Kasm will contend.
      # Reasoning in DECISIONS.md O-007.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - backend-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/data/data/prometheus:/prometheus
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "0.50", memory: 1024M }
        # Reservations are the load-bearing setting: they tell the kernel what
        # to protect, so a Kasm workspace is evicted before Prometheus (§22).
        reservations: { memory: 768M }
    oom_score_adj: -500
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5", tag: "{{.Name}}" } }

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    expose:
      - "9093"
    networks:
      # backend-net is internal (no egress) but Alertmanager must reach Brevo.
      # proxy-net provides that one deliberate hole; nothing proxies TO it.
      - backend-net
      - proxy-net
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /mnt/data/data/alertmanager:/alertmanager
    env_file: [ .env ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:   { cpus: "0.10", memory: 128M }
        reservations: { memory: 96M }
    oom_score_adj: -500
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5", tag: "{{.Name}}" } }

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    expose:
      - "3000"
    networks:
      - backend-net     # to query Prometheus
      - proxy-net       # so nginx can reach it
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /mnt/data/data/grafana:/var/lib/grafana
    env_file: [ .env ]
    environment:
      # serve_from_sub_path is the setting people miss: without it Grafana
      # generates absolute URLs at / and the UI half-works in a way that looks
      # like a proxy bug.
      GF_SERVER_ROOT_URL: "https://%(domain)s/monitoring/"
      GF_SERVER_DOMAIN: "127.0.0.1"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      # lax, not strict: strict breaks the login redirect flow.
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_METRICS_ENABLED: "true"
      TZ: UTC
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- -T 3 http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:   { cpus: "0.40", memory: 512M }
        reservations: { memory: 256M }
    oom_score_adj: -500
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5", tag: "{{.Name}}" } }

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    expose:
      - "9113"
    networks:
      - backend-net
      - proxy-net       # to reach nginx's internal :8080
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    read_only: true
    deploy:
      resources:
        limits:   { cpus: "0.05", memory: 64M }
        reservations: { memory: 16M }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5", tag: "{{.Name}}" } }

  # Blackbox: probes endpoints the way a user reaches them, from outside the app.
  # Every other target here reports on itself — a service that is wedged but
  # still scraping looks healthy. This one asks "does the URL answer correctly?"
  # and is the only check that would catch a broken TLS chain or a bad redirect.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    networks:
      - backend-net
      - proxy-net       # must reach nginx to probe the public paths
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    read_only: true
    healthcheck:
      # Proves it can serve a probe, not merely that the process is alive.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:   { cpus: "0.05", memory: 64M }
        reservations: { memory: 16M }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5", tag: "{{.Name}}" } }

networks:
  backend-net:
    external: true
  proxy-net:
    external: true
