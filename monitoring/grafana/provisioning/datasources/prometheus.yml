apiVersion: 1

# deleteDatasources removes the auto-UID instance created before the uid below
# was pinned, so we do not end up with two Prometheus datasources.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # PINNED uid. Without it Grafana generates one (it chose
    # PBFA97CFB590B2093), while the dashboards in git reference "prometheus" —
    # so every panel resolved to a datasource that did not exist and rendered
    # empty. Provisioned dashboards and provisioned datasources must agree on a
    # stable uid, and the only way to guarantee that is to set it.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
