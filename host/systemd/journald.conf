# Managed from git — see host/README.md
# Storage was already persistent (/var/log/journal exists); it was UNBOUNDED,
# which is how a journal fills / and takes sshd and Docker down with it.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=1G
MaxRetentionSec=30day
MaxFileSec=1day
ForwardToSyslog=no
