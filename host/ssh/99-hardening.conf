# Managed from git — host/ssh/99-hardening.conf. O-012 / docs/PLAN.md §17.
#
# A drop-in rather than edits to sshd_config, so the distribution file stays
# pristine and this whole change is one file to delete if it misbehaves.
#
# Password auth was ALREADY off and AllowUsers already set before this project
# started — these are the three remaining items.

# Key-based root login is still root login. Administration is via prodadmin + sudo.
PermitRootLogin no

# Unused here, and it is attack surface. Note this does NOT affect xrdp/XFCE:
# that is a separate service, not SSH X11 tunnelling.
X11Forwarding no

# 6 -> 3. Password auth is off, so this only bounds key-offer attempts.
MaxAuthTries 3

# Modest extras, uncontroversial:
LoginGraceTime 30
MaxSessions 10
ClientAliveInterval 300
ClientAliveCountMax 2

# use. sshd_config.d is Included at the TOP of sshd_config, so this wins.

