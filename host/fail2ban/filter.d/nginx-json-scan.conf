# Managed from git. Matches our canonical JSON access log (rule 10).
#
# Stock nginx filters parse the combined log format and match NOTHING against
# JSON — they would sit enabled and silently never fire, which is worse than
# no jail at all. This one reads the fields we actually emit.
#
# NO explicit datepattern: fail2ban's auto-detection reads our RFC3339 "ts"
# field natively (2763/2763 hits). An explicit pattern here produced ZERO date
# hits, which silently breaks findtime windows — the jail matches lines but
# cannot age them, so the counter never works as intended.
[Definition]
failregex = ^\{.*"source_ip":"<HOST>".*"status":(?:404|444|400),
ignoreregex = ^\{.*"target":"/(healthz|\.well-known/.*)".*$
