# Managed from git — see host/README.md
# IPv6 is deliberately NOT disabled: Tailscale uses it internally, and this
# instance has no public IPv6 to protect.
#
# rp_filter stays at 2 (LOOSE), which is Ubuntu's default here — deliberately
# NOT tightened to 1 (strict). Strict mode drops packets whose reply route
# differs from the arrival interface, which is a documented way to break
# Tailscale on subnet routers and exit nodes. This host is neither today, but
# the Kasm -> your-laptop RDP path may yet make it one, and Tailscale is the
# ONLY admin path. Loose mode already blocks the spoofing that matters on a
# single-homed cloud VM; strict buys almost nothing here and risks everything.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.tcp_syncookies = 1
kernel.dmesg_restrict = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
